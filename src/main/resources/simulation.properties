# =============================================================================
# Ecosystem Simulation -- Bundled Default Configuration (read-only seed)
# =============================================================================
# Packaged on the classpath and used only once, to bootstrap
# config/simulation.properties the first time the application runs. After
# that, every load reads config/simulation.properties only.
#
# Every value below is genuinely consumed: species defaults flow through
# EntityFactory into both the initial population and every reproduced
# offspring; world/environment values flow into World/Environment
# construction. Values are all optional -- any key you omit falls back to the
# same default shown here (see SimulationConfig).
# =============================================================================

world.width=50
world.height=50

population.predator=3
population.herbivore=15
population.plant=40

predator.energy=80
predator.speed=2.0
predator.attackPower=7
predator.visionRange=10
predator.maxAge=140
predator.reproductionCooldown=40
predator.energyConsumption=2
predator.cap=5

herbivore.energy=50
herbivore.speed=1.5
herbivore.defensePower=12
herbivore.visionRange=18
herbivore.maxAge=80
herbivore.reproductionCooldown=20
herbivore.energyConsumption=1
herbivore.cap=22

plant.energy=50
plant.growthRate=2.0
plant.maxAge=100
plant.reproductionCooldown=12
plant.cap=120

environment.foodLevel=50
environment.maxFoodLevel=100
environment.foodRegenRate=5
environment.temperature=20.0

# Stopping condition used by HeadlessRunner (the interactive GUI runs until paused/closed).
simulation.maxSteps=200
